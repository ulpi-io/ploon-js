<!DOCTYPE html><html><head><title>JSON to PLOON</title><style>body{font-family:monospace;margin:20px auto;max-width:800px;padding:20px;background:#f5f5f5}textarea{width:100%;height:200px;padding:10px;border:1px solid #ddd;border-radius:5px;font-family:monospace}button{background:#007acc;color:white;padding:10px 20px;border:none;border-radius:5px;margin:5px}</style></head><body><h1>JSON to PLOON Converter</h1><input type=file id=fi accept=.json><br><br><textarea id=ji placeholder='Paste JSON here...'></textarea><br><br><button onclick=convert>Convert</button><button onclick=copy id=cp disabled>Copy</button><button onclick=down id=dl disabled>Download</button><button onclick=clr>Clear</button><br><br><textarea id=out readonly></textarea><div id=st></div><script>function convert(){let t=document.getElementById('ji').value.trim();if(!t)return;try{let d=JSON.parse(t);let o=Array.isArray(d)?d.map((x,i)=>i+1+'|'+Object.values(x).join('|')).join('\n'):JSON.stringify(d,0,0);if(Array.isArray(d)&&d.length){let keys=Object.keys(d[0]||{});if(typeof d[0]=='object')o=[d.length+']('+keys.join(',')+')\n\n'+d.map((x,i)=>i+1+'|'+keys.map(k=>x[k]??'').join('|')).join('\n')}document.getElementById('out').value=o;let before=t.length;let after=o.length;let perc=Math.round((before-after)/before*100);document.getElementById('st').innerHTML=before+'→'+after+' chars ('+perc+'%)';document.getElementById('cp').disabled=false;document.getElementById('dl').disabled=false}catch(e){alert('Invalid JSON')}}function copy(){let o=document.getElementById('out');o.select();document.execCommand('copy')}function down(){let b=new Blob([document.getElementById('out').value]);let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='output.ploon';a.click()}function clr(){document.getElementById('ji').value='';document.getElementById('out').value='';document.getElementById('cp').disabled=true;document.getElementById('dl').disabled=true}document.getElementById('fi').addEventListener('change',function(e){let f=e.target.files[0];if(f){let r=new FileReader();r.onload=e=>document.getElementById('ji').value=e.target.result;r.readAsText(f)}})</script></body></html>
