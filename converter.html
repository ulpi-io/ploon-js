<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JSON → PLOON Converter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: 'Consolas', 'Menlo', 'SFMono-Regular', monospace;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #eef2f5;
        display: flex;
        justify-content: center;
      }
      .panel {
        width: min(960px, 100%);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        padding: 32px;
        border: 1px solid #dbe5f0;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        color: #0f172a;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 200px;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #cbd5f5;
        background: #f8fafc;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.5;
        resize: vertical;
      }
      label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
        color: #1f2937;
      }
      .row {
        display: grid;
        gap: 16px;
        margin-bottom: 20px;
      }
      .row.two-col {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        align-items: end;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0;
      }
      button {
        background: #2563eb;
        border: none;
        border-radius: 8px;
        color: #fff;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .stats {
        font-size: 13px;
        color: #475569;
        margin-top: 10px;
      }
      .error {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        display: none;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 14px;
        color: #334155;
      }
      .options label {
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
      }
      input[type='file'] {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>JSON → PLOON Converter</h1>

      <div class="row">
        <label for="fileInput">Upload JSON file</label>
        <input id="fileInput" type="file" accept=".json,application/json" />
      </div>

      <div class="row">
        <label for="jsonInput">Or paste JSON</label>
        <textarea
          id="jsonInput"
          placeholder='{"ploons":[{"ploonId":"pl001","name":"Alpha"}]}'
        ></textarea>
      </div>

      <div class="options" aria-label="Conversion settings">
        <label
          ><input type="radio" name="format" value="compact" checked /> Compact
          (;) </label
        >
        <label
          ><input type="radio" name="format" value="standard" /> Standard
          (multiline)</label
        >
        <label
          ><input type="checkbox" id="minifyToggle" checked />
          Minify&nbsp;schema</label
        >
      </div>

      <div class="controls">
        <button id="convertBtn" type="button">Convert to PLOON</button>
        <button id="copyBtn" type="button" disabled>Copy output</button>
        <button id="downloadBtn" type="button" disabled>
          Download .ploon
        </button>
        <button id="clearBtn" class="secondary" type="button">Clear</button>
      </div>

      <div class="row">
        <label for="output">PLOON output</label>
        <textarea id="output" readonly></textarea>
      </div>
      <div class="stats" id="stats"></div>
      <div class="error" id="errorBox"></div>
    </div>

    <script type="module">
      import { stringify, minify } from './ploon-browser.js'

      const $ = id => document.getElementById(id)

      const fileInput = $('fileInput')
      const jsonInput = $('jsonInput')
      const outputArea = $('output')
      const statsBox = $('stats')
      const copyBtn = $('copyBtn')
      const downloadBtn = $('downloadBtn')
      const errorBox = $('errorBox')
      const minifyToggle = $('minifyToggle')
      const formatRadios = Array.from(document.querySelectorAll("input[name='format']"))

      $('convertBtn').addEventListener('click', handleConvert)
      $('copyBtn').addEventListener('click', handleCopy)
      $('downloadBtn').addEventListener('click', handleDownload)
      $('clearBtn').addEventListener('click', handleClear)
      fileInput.addEventListener('change', handleFileUpload)

      function getSelectedFormat() {
        return formatRadios.find(radio => radio.checked)?.value ?? 'compact'
      }

      function handleFileUpload(event) {
        const file = event.target.files?.[0]
        if (!file) return

        const reader = new FileReader()
        reader.onload = e => {
          jsonInput.value = e.target?.result ?? ''
          resetState(false)
        }
        reader.readAsText(file)
      }

      function handleConvert() {
        const raw = jsonInput.value.trim()
        if (!raw) {
          showError('Bitte füge JSON ein oder lade eine Datei hoch.')
          return
        }

        try {
          const parsed = JSON.parse(raw)
          const format = getSelectedFormat()
          const separator = format === 'compact' ? ';' : '\n'
          let ploon = stringify(parsed, { format })
          if (minifyToggle.checked) {
            ploon = minify(ploon)
          }
          ploon = collapseDoubleSeparator(ploon, separator)
          outputArea.value = ploon
          updateStats(raw.length, ploon.length)
          copyBtn.disabled = false
          downloadBtn.disabled = false
          showError('')
        } catch (err) {
          showError(err instanceof Error ? err.message : String(err))
          resetState(false)
        }
      }

      async function handleCopy() {
        const text = outputArea.value
        if (!text) return

        try {
          await navigator.clipboard.writeText(text)
        } catch {
          outputArea.select()
          document.execCommand('copy')
        }
      }

      function handleDownload() {
        const blob = new Blob([outputArea.value], { type: 'text/plain' })
        const url = URL.createObjectURL(blob)
        const link = document.createElement('a')
        link.href = url
        link.download = 'output.ploon'
        link.click()
        URL.revokeObjectURL(url)
      }

      function handleClear() {
        jsonInput.value = ''
        fileInput.value = ''
        resetState()
      }

      function resetState(clearErrors = true) {
        outputArea.value = ''
        statsBox.textContent = ''
        copyBtn.disabled = true
        downloadBtn.disabled = true
        if (clearErrors) showError('')
      }

      function showError(message) {
        errorBox.textContent = message
        errorBox.style.display = message ? 'block' : 'none'
      }

      function updateStats(before, after) {
        if (!before) {
          statsBox.textContent = ''
          return
        }
        const diff = before - after
        const percent = Math.round((diff / before) * 100)
        statsBox.textContent = `${before} → ${after} Zeichen (${percent}% Reduktion)`
      }

      function collapseDoubleSeparator(text, separator) {
        if (!separator) return text
        const double = separator + separator
        const index = text.indexOf(double)
        if (index === -1) return text
        return text.slice(0, index) + separator + text.slice(index + double.length)
      }
    </script>
  </body>
</html>
